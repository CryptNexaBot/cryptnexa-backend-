  <script>
    lucide.createIcons();
    let tg = window.Telegram?.WebApp;
    let currentUserProfile = { name: 'Investor', username: '@investor', id: '7076265514' };

    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        const user = tg.initDataUnsafe.user;
        currentUserProfile.name = user.first_name + (user.last_name ? ' ' + user.last_name : '');
        currentUserProfile.username = user.username ? '@' + user.username : '@User_' + user.id;
        currentUserProfile.id = user.id.toString();
        document.getElementById('user-name').innerText = currentUserProfile.name;
        document.getElementById('user-avatar').innerText = user.first_name.charAt(0);
      }
    }

    document.getElementById('profile-fullname').innerText = currentUserProfile.name;
    document.getElementById('profile-telegram-id').innerText = "ID: " + currentUserProfile.id;

    const BACKEND_URL = "https://cryptnexa-backend.onrender.com";

    // 1. Soo jiidashada Qorshayaasha (Plans) ee Supabase
    async function loadPlans() {
      try {
        let res = await fetch(`${BACKEND_URL}/api/plans`);
        let data = await res.json();
        console.log("Plans loaded:", data.plans);
      } catch (err) {
        console.error("Error loading plans:", err);
      }
    }

    // 2. Abuurista Deposit-ka Dhabta ah (Real Deposit with Unique Decimal)
    async function initiateRealDeposit() {
      const amtInput = document.getElementById('deposit-amount-input').value;
      const amt = parseFloat(amtInput);
      
      if (isNaN(amt) || amt <= 0) {
        alert('Fadlan geli xaddiga saxda ah ee USDT!');
        return;
      }

      // Xulashada plan_id (tusaale ahaan Starter plan waa 1)
      let planId = 1; 

      try {
        let response = await fetch(`${BACKEND_URL}/api/create-deposit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telegram_id: parseInt(currentUserProfile.id),
            amount: amt,
            plan_id: planId
          })
        });

        let result = await response.json();
        if (response.ok) {
          alert(`Dalabkii waa la sameeyay!\n\nFadlan ku soo dir xaddiga saxda ah ee: ${result.expected_amount} USDT shabakadda TRC20.\n\nKadib riix badhanka Xaqiijinta (Verify).`);
          document.getElementById('tx-hash-input').value = `Send exact: ${result.expected_amount} USDT`;
        } else {
          alert('Khalad: ' + result.detail);
        }
      } catch (e) {
        alert('Server-ka lama xiriiri karo: ' + e);
      }
    }

    // 3. Xaqiijinta Lacagta (Verify Deposit via Bybit API)
    async function verifyRealDeposit() {
      try {
        let response = await fetch(`${BACKEND_URL}/api/verify-deposit?telegram_id=${currentUserProfile.id}`, {
          method: 'POST'
        });

        let result = await response.json();
        if (response.ok) {
          alert(result.message);
          backToWalletOverview();
        } else {
          alert(result.detail || 'Weli lama helin lacagta.');
        }
      } catch (e) {
        alert('Khalad ka dhacay xaqiijinta: ' + e);
      }
    }

    loadPlans();
  </script>
